document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg ">\n\n      <section style=\"max-width: 1280px; margin: 0 auto; padding: clamp(72px, 8vw, 120px) clamp(20px, 4vw, 40px) 24px;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 32px;\">\n          <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(32px, 3.4vw, 48px); line-height: 1.1; margin: 0;\">Sélection du moment<\u002Fh2>\n          <a sc-camel-on-click=\"{{ goBiens }}\" style=\"cursor: pointer; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase;\">Voir les {{ totalCount }} biens →<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: clamp(32px, 4vw, 64px) clamp(24px, 3vw, 48px); background: transparent;\">\n          <sc-for list=\"{{ featured }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <article style=\"background: var(--color-bg); display: flex; flex-direction: column;\">\n              <div class=\"grayscale\" style=\"position: relative;\">\n                <image-slot id=\"{{ b.slotId }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Photo du bien\" style=\"width: 100%; aspect-ratio: 4 / 3;\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <div style=\"padding: 24px 0 0; display: flex; gap: 8px; flex-wrap: wrap;\">\n                <span class=\"tag tag-accent\">{{ b.statut }}<\u002Fspan>\n                <span class=\"tag tag-outline\">{{ b.type }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(26px, 2.1vw, 32px); line-height: 1.18; margin: 16px 0 10px;\">{{ b.titre }}<\u002Fh3>\n              <p style=\"margin: 0 0 20px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 72%, transparent);\">{{ b.ville }} · {{ b.surface }} m² · {{ b.pieces }} pièces<\u002Fp>\n              <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 28px; margin: auto 0 20px; padding-top: 18px; border-top: 1px solid var(--color-divider);\">{{ b.prixFmt }}<\u002Fp>\n              <div style=\"display: flex; gap: 8px;\">\n                <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ b.open }}\">Voir le bien<\u002Fbutton>\n                <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ b.toggleFav }}\">{{ b.favLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width: 1280px; margin: 0 auto; padding: clamp(72px, 8vw, 120px) clamp(20px, 4vw, 40px);\">\n        <span style=\"display: block; font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 32px;\">Nos expertises<\u002Fspan>\n        <sc-for list=\"{{ expertises }}\" as=\"e\" hint-placeholder-count=\"4\">\n          <div style=\"display: grid; grid-template-columns: minmax(48px, 100px) minmax(220px, 360px) minmax(240px, 1fr); gap: 20px 56px; align-items: baseline; padding: 28px 0; border-top: 2px solid var(--color-divider);\">\n            <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 15px; margin: 0;\">{{ e.num }}<\u002Fp>\n            <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 28px; line-height: 1.2; margin: 0;\">{{ e.titre }}<\u002Fh3>\n            <p style=\"font-size: 15.5px; margin: 0; max-width: 56ch; color: color-mix(in srgb, var(--color-text) 78%, transparent);\">{{ e.texte }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n      <section style=\"max-width: 1280px; margin: 0 auto; padding: 24px clamp(20px, 4vw, 40px) clamp(80px, 8vw, 120px); display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 56px; align-items: center;\">\n        <div>\n          <span style=\"display: block; font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 28px;\">L’agence<\u002Fspan>\n          <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(30px, 3vw, 42px); line-height: 1.12; margin: 0 0 24px;\">Cinq négociateurs, un seul dossier à la fois<\u002Fh2>\n          <p style=\"font-size: 15.5px; margin: 0 0 24px; max-width: 50ch; color: color-mix(in srgb, var(--color-text) 78%, transparent);\">Chaque mandat est suivi par le négociateur qui l’a signé, de la première visite à la signature chez le notaire. Nous limitons volontairement le nombre de biens en portefeuille pour tenir ce niveau de suivi.<\u002Fp>\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goAgence }}\">Découvrir l’équipe<\u002Fbutton>\n        <\u002Fdiv>\n        <figure class=\"grayscale\" style=\"margin: 0;\">\n          <image-slot id=\"agence-split\" shape=\"rect\" fit=\"cover\" src=\"{{ photoSrc }}\" placeholder=\"Photo de l’équipe ou de l’agence\" style=\"width: 100%; aspect-ratio: 4 / 3;\"><\u002Fimage-slot>\n        <\u002Ffigure>\n      <\u002Fsection>\n\n      <section style=\"max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px) clamp(80px, 8vw, 120px);\">\n        <figure style=\"margin: 0; border-top: 2px solid var(--color-divider); padding-top: 48px;\">\n          <blockquote style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px, 3.2vw, 46px); font-style: italic; font-weight: 300; line-height: 1.28; max-width: 34ch; margin: 0;\">“Ils ont refusé deux offres que j’étais prêt à accepter. Ils avaient raison : la troisième était supérieure de 12 millions.”<\u002Fblockquote>\n          <figcaption style=\"font-size: 15.5px; margin: 28px 0 0; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">— M. Adjaho, vendeur, Tokoin<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsection>\n\n      <section style=\"background: var(--color-accent); color: var(--color-bg);\">\n        <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(80px, 9vw, 136px) clamp(20px, 4vw, 40px);\">\n          <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(40px, 5vw, 76px); line-height: 1.04; letter-spacing: 0; margin: 0 0 32px; margin-left: -0.022em;\">\n            <span style=\"display: block;\">Combien vaut votre bien ?<\u002Fspan>\n            <span style=\"display: block;\">Réponse en 48 heures.<\u002Fspan>\n          <\u002Fh3>\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goEstimation }}\" style=\"color: var(--color-bg); border-color: var(--color-bg);\">Demander une estimation gratuite<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- LISTE DES BIENS -->\n  <sc-if value=\"{{ isBiens }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(56px, 7vw, 104px) clamp(20px, 4vw, 40px) clamp(72px, 8vw, 120px);\">\n      <span style=\"display: block; font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 28px;\">Biens disponibles<\u002Fspan>\n      <h1 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(42px, 5.4vw, 82px); line-height: 1.04; letter-spacing: 0; margin: 0 0 32px; margin-left: -0.022em;\">Le portefeuille<\u002Fh1>\n\n      <div style=\"border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider); padding: 24px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; align-items: end;\">\n        <label class=\"field\" style=\"display: block;\">\n          <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Recherche<\u002Fspan>\n          <input class=\"input\" type=\"text\" value=\"{{ q }}\" sc-camel-on-input=\"{{ onQuery }}\" placeholder=\"Quartier, référence, mot-clé\" style=\"width: 100%;\">\n        <\u002Flabel>\n        <label class=\"field\" style=\"display: block;\">\n          <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Type<\u002Fspan>\n          <sc-raw-select class=\"input\" value=\"{{ fType }}\" sc-camel-on-change=\"{{ onType }}\" style=\"width: 100%;\">\n            <sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <option value=\"{{ t }}\">{{ t }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <label class=\"field\" style=\"display: block;\">\n          <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Transaction<\u002Fspan>\n          <sc-raw-select class=\"input\" value=\"{{ fStatut }}\" sc-camel-on-change=\"{{ onStatut }}\" style=\"width: 100%;\">\n            <sc-for list=\"{{ statuts }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <option value=\"{{ s }}\">{{ s }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <label class=\"field\" style=\"display: block;\">\n          <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Budget max<\u002Fspan>\n          <sc-raw-select class=\"input\" value=\"{{ fBudget }}\" sc-camel-on-change=\"{{ onBudget }}\" style=\"width: 100%;\">\n            <sc-for list=\"{{ budgets }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <option value=\"{{ b.value }}\">{{ b.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <label class=\"field\" style=\"display: block;\">\n          <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Tri<\u002Fspan>\n          <sc-raw-select class=\"input\" value=\"{{ fSort }}\" sc-camel-on-change=\"{{ onSort }}\" style=\"width: 100%;\">\n            <sc-for list=\"{{ sorts }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <option value=\"{{ s }}\">{{ s }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding: 20px 0 28px;\">\n        <p style=\"margin: 0; font-size: 14.5px; color: color-mix(in srgb, var(--color-text) 72%, transparent);\">{{ resultLabel }}<\u002Fp>\n        <div style=\"display: flex; gap: 8px;\">\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ toggleFavOnly }}\">{{ favOnlyLabel }}<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ resetFilters }}\">Réinitialiser<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: clamp(32px, 4vw, 64px) clamp(24px, 3vw, 48px); background: transparent;\">\n        <sc-for list=\"{{ results }}\" as=\"b\" hint-placeholder-count=\"6\">\n          <article style=\"background: var(--color-bg); display: flex; flex-direction: column;\">\n            <div class=\"grayscale\">\n              <image-slot id=\"{{ b.slotId }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Photo du bien\" style=\"width: 100%; aspect-ratio: 4 / 3;\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div style=\"padding: 24px 0 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;\">\n              <span class=\"tag tag-accent\">{{ b.statut }}<\u002Fspan>\n              <span class=\"tag tag-outline\">{{ b.type }}<\u002Fspan>\n              <sc-if value=\"{{ showDocs }}\" hint-placeholder-val=\"{{ true }}\">\n                <span class=\"tag tag-neutral\">{{ b.badge }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(26px, 2.1vw, 32px); line-height: 1.18; margin: 16px 0 10px;\">{{ b.titre }}<\u002Fh3>\n            <p style=\"margin: 0 0 20px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 72%, transparent);\">{{ b.ville }} · {{ b.surface }} m² · {{ b.pieces }} pièces · réf. {{ b.ref }}<\u002Fp>\n            <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 28px; margin: auto 0 20px; padding-top: 18px; border-top: 1px solid var(--color-divider);\">{{ b.prixFmt }}<\u002Fp>\n            <div style=\"display: flex; gap: 8px;\">\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ b.open }}\">Voir le bien<\u002Fbutton>\n              <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ b.toggleFav }}\">{{ b.favLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border: 2px solid var(--color-divider); padding: 48px 32px;\">\n          <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 24px; margin: 0 0 12px;\">Aucun bien ne correspond<\u002Fh3>\n          <p style=\"margin: 0 0 20px; font-size: 15.5px; color: color-mix(in srgb, var(--color-text) 78%, transparent);\">Élargissez le budget ou le type de bien. Nous pouvons aussi vous alerter dès qu’un bien correspondant entre au portefeuille.<\u002Fp>\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ resetFilters }}\">Voir tous les biens<\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goContact }}\">Créer une alerte<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- FICHE BIEN -->\n  <sc-if value=\"{{ isFiche }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 40px clamp(20px, 4vw, 40px) clamp(72px, 8vw, 120px);\">\n      <a sc-camel-on-click=\"{{ goBiens }}\" style=\"cursor: pointer; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase;\">← Retour au portefeuille<\u002Fa>\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin: 32px 0 20px;\">\n        <span class=\"tag tag-accent\">{{ sel.statut }}<\u002Fspan>\n        <span class=\"tag tag-outline\">{{ sel.type }}<\u002Fspan>\n        <span class=\"tag tag-neutral\">réf. {{ sel.ref }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: end; justify-content: space-between; gap: 32px; flex-wrap: wrap; border-bottom: 2px solid var(--color-divider); padding-bottom: 28px;\">\n        <div>\n          <h1 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(38px, 4.4vw, 64px); line-height: 1.04; letter-spacing: 0; margin: 0 0 12px; margin-left: -0.022em; max-width: 24ch;\">{{ sel.titre }}<\u002Fh1>\n          <p style=\"margin: 0; font-size: 16px; color: color-mix(in srgb, var(--color-text) 75%, transparent);\">{{ sel.ville }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"text-align: left;\">\n          <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 38px; line-height: 1; letter-spacing: 0; margin: 0 0 8px; color: var(--color-accent);\">{{ sel.prixFmt }}<\u002Fp>\n          <p style=\"margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">{{ sel.prixNote }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"grayscale\" style=\"margin: 32px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2px;\">\n        <image-slot id=\"{{ sel.slotMain }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Photo principale\" style=\"width: 100%; aspect-ratio: 16 / 10;\"><\u002Fimage-slot>\n        <div style=\"display: grid; grid-template-rows: 1fr 1fr; gap: 2px;\">\n          <image-slot id=\"{{ sel.slotB }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Photo 2\" style=\"width: 100%; height: 100%;\"><\u002Fimage-slot>\n          <image-slot id=\"{{ sel.slotC }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Photo 3\" style=\"width: 100%; height: 100%;\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 56px; align-items: start;\">\n        <div>\n          <sc-raw-table class=\"table\" style=\"width: 100%; margin-bottom: 40px;\">\n            <sc-raw-tbody>\n              <sc-for list=\"{{ sel.specs }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <sc-raw-tr>\n                  <sc-raw-th style=\"text-align: left; width: 40%;\">{{ s.k }}<\u002Fsc-raw-th>\n                  <sc-raw-td>{{ s.v }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n\n          <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 32px; margin: 0 0 20px;\">Description<\u002Fh2>\n          <p style=\"font-size: 16.5px; margin: 0 0 32px; max-width: 62ch; color: color-mix(in srgb, var(--color-text) 84%, transparent);\">{{ sel.description }}<\u002Fp>\n\n          <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 32px; margin: 0 0 24px;\">Prestations<\u002Fh2>\n          <ul style=\"list-style: none; padding: 0; margin: 0 0 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px;\">\n            <sc-for list=\"{{ sel.prestations }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <li style=\"display: flex; gap: 12px; align-items: baseline; font-size: 15.5px; border-bottom: 1px solid var(--color-divider); padding-bottom: 10px;\">\n                <span style=\"width: 8px; height: 8px; background: var(--color-accent); flex: 0 0 auto;\"><\u002Fspan>\n                <span>{{ p }}<\u002Fspan>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n\n          <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 32px; margin: 0 0 24px;\">Dossier juridique<\u002Fh2>\n          <div style=\"border-top: 2px solid var(--color-divider);\">\n            <sc-for list=\"{{ sel.docsList }}\" as=\"d\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\">\n                <span style=\"font-size: 15.5px;\">{{ d.label }}<\u002Fspan>\n                <span class=\"{{ d.cls }}\">{{ d.mark }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 14px; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Chaque pièce est vérifiée à l’agence avant la mise en vente. Les documents originaux sont consultables sur place, en présence du vendeur ou du notaire.<\u002Fp>\n        <\u002Fdiv>\n\n        <aside style=\"border: 2px solid var(--color-divider); padding: 28px;\">\n          <span style=\"display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 20px;\">Votre négociateur<\u002Fspan>\n          <div style=\"display: flex; gap: 16px; align-items: center; margin-bottom: 24px;\">\n            <div class=\"grayscale\" style=\"flex: 0 0 auto;\">\n              <image-slot id=\"{{ sel.agentSlot }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Portrait\" style=\"width: 116px; height: 148px;\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 18px; margin: 0 0 4px;\">{{ sel.agent }}<\u002Fp>\n              <p style=\"margin: 0; font-size: 14px; color: color-mix(in srgb, var(--color-text) 72%, transparent);\">{{ sel.agentRole }}<\u002Fp>\n              <p style=\"margin: 4px 0 0; font-size: 14px;\">{{ phone }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ visitSent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border: 2px solid var(--color-accent); padding: 20px;\">\n              <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 18px; margin: 0 0 8px;\">Demande envoyée<\u002Fp>\n              <p style=\"margin: 0; font-size: 14.5px;\">{{ sel.agent }} vous rappelle sous 24 h ouvrées pour fixer la visite.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ visitOpen }}\" hint-placeholder-val=\"{{ true }}\">\n            <form sc-camel-on-submit=\"{{ onVisitSubmit }}\" style=\"display: grid; gap: 16px;\">\n              <label class=\"field\" style=\"display: block;\">\n                <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Nom<\u002Fspan>\n                <input class=\"input\" type=\"text\" required=\"{{ true }}\" style=\"width: 100%;\">\n              <\u002Flabel>\n              <label class=\"field\" style=\"display: block;\">\n                <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Téléphone<\u002Fspan>\n                <input class=\"input\" type=\"tel\" required=\"{{ true }}\" style=\"width: 100%;\">\n              <\u002Flabel>\n              <label class=\"field\" style=\"display: block;\">\n                <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Créneau souhaité<\u002Fspan>\n                <input class=\"input\" type=\"text\" placeholder=\"Samedi matin, en semaine après 17 h…\" style=\"width: 100%;\">\n              <\u002Flabel>\n              <button type=\"submit\" class=\"btn btn-primary btn-block\">Demander une visite<\u002Fbutton>\n              <button type=\"button\" class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ toggleSelFav }}\">{{ selFavLabel }}<\u002Fbutton>\n            <\u002Fform>\n          <\u002Fsc-if>\n        <\u002Faside>\n      <\u002Fdiv>\n\n      <div style=\"border-top: 2px solid var(--color-divider); margin-top: 64px; padding-top: 40px;\">\n        <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 32px; margin: 0 0 32px;\">Biens similaires<\u002Fh2>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: clamp(32px, 4vw, 64px) clamp(24px, 3vw, 48px); background: transparent;\">\n          <sc-for list=\"{{ similar }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <article style=\"background: var(--color-bg);\">\n              <div class=\"grayscale\">\n                <image-slot id=\"{{ b.slotId }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Photo du bien\" style=\"width: 100%; aspect-ratio: 4 / 3;\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 26px; line-height: 1.18; margin: 20px 0 10px;\">{{ b.titre }}<\u002Fh3>\n              <p style=\"margin: 0 0 20px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 72%, transparent);\">{{ b.ville }} · {{ b.prixFmt }}<\u002Fp>\n              <div>\n                <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ b.open }}\">Voir le bien<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- AGENCE -->\n  <sc-if value=\"{{ isAgence }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(56px, 7vw, 104px) clamp(20px, 4vw, 40px) clamp(72px, 8vw, 120px);\">\n      <span style=\"display: block; font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 28px;\">L’agence<\u002Fspan>\n      <h1 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(42px, 5.4vw, 82px); line-height: 1.04; letter-spacing: 0; margin: 0 0 28px; margin-left: -0.022em; max-width: 26ch;\">Un portefeuille court, tenu de près<\u002Fh1>\n      <p style=\"font-size: 17.5px; max-width: 58ch; margin: 0 0 48px; color: color-mix(in srgb, var(--color-text) 82%, transparent);\">Alassani Immobilier a été fondée en 2009 dans le quartier Coconut. Nous travaillons sur le Grand Lomé, de Bè à Baguida et jusqu’à Agoè, en vente comme en location, avec une règle simple : ne prendre que les mandats que nous pouvons défendre.<\u002Fp>\n\n      <div class=\"grayscale\" style=\"margin-bottom: 56px;\">\n        <image-slot id=\"agence-hero\" shape=\"rect\" fit=\"cover\" src=\"{{ photoSrc }}\" placeholder=\"Photo de la façade ou des bureaux\" style=\"width: 100%; aspect-ratio: 21 / 9;\"><\u002Fimage-slot>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px; border-top: 2px solid var(--color-divider); padding-top: 40px; margin-bottom: 64px;\">\n        <sc-for list=\"{{ valeurs }}\" as=\"v\" hint-placeholder-count=\"3\">\n          <div>\n            <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 15px; margin: 0 0 16px; color: var(--color-accent-700);\">{{ v.num }}<\u002Fp>\n            <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 22px; line-height: 1.2; margin: 0 0 12px;\">{{ v.titre }}<\u002Fh3>\n            <p style=\"font-size: 15.5px; margin: 0; color: color-mix(in srgb, var(--color-text) 78%, transparent);\">{{ v.texte }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(30px, 3vw, 42px); margin: 0 0 40px;\">L’équipe<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 32px;\">\n        <sc-for list=\"{{ equipe }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <div>\n            <div class=\"grayscale\" style=\"margin-bottom: 16px;\">\n              <image-slot id=\"{{ m.slot }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Portrait\" style=\"width: 100%; aspect-ratio: 4 / 5;\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 19px; margin: 0 0 4px;\">{{ m.nom }}<\u002Fp>\n            <p style=\"margin: 0 0 10px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700);\">{{ m.role }}<\u002Fp>\n            <p style=\"margin: 0; font-size: 14.5px; color: color-mix(in srgb, var(--color-text) 75%, transparent);\">{{ m.note }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"border-top: 2px solid var(--color-divider); margin-top: 64px; padding-top: 40px; display: flex; gap: 12px; flex-wrap: wrap;\">\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goEstimation }}\">Confier un bien à l’agence<\u002Fbutton>\n        <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goBiens }}\">Voir le portefeuille<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ESTIMATION -->\n  <sc-if value=\"{{ isEstimation }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(56px, 7vw, 104px) clamp(20px, 4vw, 40px) clamp(72px, 8vw, 120px); display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 64px; align-items: start;\">\n      <div>\n        <span style=\"display: block; font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 28px;\">Estimation<\u002Fspan>\n        <h1 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(40px, 4.6vw, 68px); line-height: 1.04; letter-spacing: 0; margin: 0 0 24px; margin-left: -0.022em;\">Le prix juste, argumenté<\u002Fh1>\n        <p style=\"font-size: 16.5px; margin: 0 0 32px; max-width: 48ch; color: color-mix(in srgb, var(--color-text) 82%, transparent);\">Nous croisons les transactions réelles de votre quartier, l’état du bien, son dossier foncier et la demande du moment. Vous recevez une fourchette écrite, avec les biens comparables qui la justifient.<\u002Fp>\n        <sc-for list=\"{{ etapes }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div style=\"display: grid; grid-template-columns: 48px 1fr; gap: 20px; padding: 24px 0; border-top: 2px solid var(--color-divider);\">\n            <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 15px; margin: 0;\">{{ e.num }}<\u002Fp>\n            <div>\n              <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 20px; margin: 0 0 8px;\">{{ e.titre }}<\u002Fh3>\n              <p style=\"font-size: 15px; margin: 0; color: color-mix(in srgb, var(--color-text) 78%, transparent);\">{{ e.texte }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"border: 2px solid var(--color-divider); padding: 36px;\">\n        <sc-if value=\"{{ estSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 26px; margin: 0 0 12px;\">Demande enregistrée<\u002Fh2>\n            <p style=\"font-size: 15.5px; margin: 0 0 24px; color: color-mix(in srgb, var(--color-text) 80%, transparent);\">Un négociateur vous appelle sous 48 heures pour convenir de la visite d’estimation. Aucun engagement de mandat.<\u002Fp>\n            <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ resetEst }}\">Envoyer une autre demande<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ estOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ onEstSubmit }}\" style=\"display: grid; gap: 20px;\">\n            <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 26px; margin: 0;\">Estimation gratuite<\u002Fh2>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n              <label class=\"field\" style=\"display: block;\">\n                <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Nom<\u002Fspan>\n                <input class=\"input\" type=\"text\" required=\"{{ true }}\" style=\"width: 100%;\">\n              <\u002Flabel>\n              <label class=\"field\" style=\"display: block;\">\n                <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Téléphone<\u002Fspan>\n                <input class=\"input\" type=\"tel\" required=\"{{ true }}\" style=\"width: 100%;\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <label class=\"field\" style=\"display: block;\">\n              <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Adresse du bien<\u002Fspan>\n              <input class=\"input\" type=\"text\" required=\"{{ true }}\" placeholder=\"Rue des Cocotiers, Coconut, Lomé\" style=\"width: 100%;\">\n            <\u002Flabel>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;\">\n              <label class=\"field\" style=\"display: block;\">\n                <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Type<\u002Fspan>\n                <sc-raw-select class=\"input\" style=\"width: 100%;\">\n                  <option>Villa<\u002Foption>\n                  <option>Maison<\u002Foption>\n                  <option>Appartement<\u002Foption>\n                  <option>Immeuble de rapport<\u002Foption>\n                  <option>Local commercial<\u002Foption>\n                  <option>Terrain<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n              <label class=\"field\" style=\"display: block;\">\n                <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Surface m²<\u002Fspan>\n                <input class=\"input\" type=\"number\" style=\"width: 100%;\">\n              <\u002Flabel>\n              <label class=\"field\" style=\"display: block;\">\n                <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Pièces<\u002Fspan>\n                <input class=\"input\" type=\"number\" style=\"width: 100%;\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <label class=\"field\" style=\"display: block;\">\n              <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Projet<\u002Fspan>\n              <sc-raw-select class=\"input\" style=\"width: 100%;\">\n                <option>Vendre dans les 3 mois<\u002Foption>\n                <option>Vendre dans l’année<\u002Foption>\n                <option>Mettre en location<\u002Foption>\n                <option>Simple curiosité<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label class=\"field\" style=\"display: block;\">\n              <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Précisions<\u002Fspan>\n              <textarea class=\"input\" rows=\"4\" placeholder=\"Titre foncier, travaux récents, forage, groupe…\" style=\"width: 100%;\"><\u002Ftextarea>\n            <\u002Flabel>\n            <button type=\"submit\" class=\"btn btn-primary btn-block\">Envoyer la demande<\u002Fbutton>\n            <p style=\"margin: 0; font-size: 13px; color: color-mix(in srgb, var(--color-text) 65%, transparent);\">Vos données servent uniquement à traiter cette demande.<\u002Fp>\n          <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- CONTACT -->\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(56px, 7vw, 104px) clamp(20px, 4vw, 40px) clamp(72px, 8vw, 120px);\">\n      <span style=\"display: block; font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 28px;\">Contact<\u002Fspan>\n      <h1 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(42px, 5.4vw, 82px); line-height: 1.04; letter-spacing: 0; margin: 0 0 48px; margin-left: -0.022em;\">Passez à l’agence<\u002Fh1>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 64px; align-items: start;\">\n        <div>\n          <div style=\"border-top: 2px solid var(--color-divider); padding: 24px 0;\">\n            <p style=\"margin: 0 0 8px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Adresse<\u002Fp>\n            <p style=\"margin: 0; font-size: 17px;\">Rue des Cocotiers, quartier Coconut<br>Lomé — Togo<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top: 2px solid var(--color-divider); padding: 24px 0;\">\n            <p style=\"margin: 0 0 8px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Téléphone<\u002Fp>\n            <p style=\"margin: 0; font-size: 17px;\">{{ phone }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top: 2px solid var(--color-divider); padding: 24px 0;\">\n            <p style=\"margin: 0 0 8px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">E-mail<\u002Fp>\n            <p style=\"margin: 0; font-size: 17px;\">contact@alassani-immobilier.tg<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider); padding: 24px 0;\">\n            <p style=\"margin: 0 0 8px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Horaires<\u002Fp>\n            <p style=\"margin: 0; font-size: 17px;\">Lundi – vendredi, 8 h – 18 h<br>Samedi, 9 h – 13 h<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border: 2px solid #141b18; background: var(--color-accent-900); color: var(--color-bg); padding: 28px; margin-top: 32px;\">\n            <p style=\"font-family: var(--font-heading); font-size: 26px; margin: 0 0 10px;\">Parler à un négociateur maintenant<\u002Fp>\n            <p style=\"margin: 0 0 20px; font-size: 15px; font-weight: 300; color: color-mix(in srgb, var(--color-bg) 80%, transparent);\">Un négociateur répond en direct du lundi au samedi, de 8 h à 18 h. En dehors de ces heures, laissez votre message : la réponse arrive à l’ouverture.<\u002Fp>\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ openChat }}\">Ouvrir le chat<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"grayscale\" style=\"margin-top: 32px;\">\n            <image-slot id=\"contact-plan\" shape=\"rect\" fit=\"cover\" placeholder=\"Plan ou photo de la vitrine\" style=\"width: 100%; aspect-ratio: 4 / 3;\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border: 2px solid var(--color-divider); padding: 36px;\">\n          <sc-if value=\"{{ msgSent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 26px; margin: 0 0 12px;\">Message envoyé<\u002Fh2>\n              <p style=\"font-size: 15.5px; margin: 0 0 24px; color: color-mix(in srgb, var(--color-text) 80%, transparent);\">Nous répondons dans la journée pendant les heures d’ouverture.<\u002Fp>\n              <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ resetMsg }}\">Écrire un autre message<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ msgOpen }}\" hint-placeholder-val=\"{{ true }}\">\n            <form sc-camel-on-submit=\"{{ onMsgSubmit }}\" style=\"display: grid; gap: 20px;\">\n              <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 26px; margin: 0;\">Nous écrire<\u002Fh2>\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n                <label class=\"field\" style=\"display: block;\">\n                  <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Nom<\u002Fspan>\n                  <input class=\"input\" type=\"text\" required=\"{{ true }}\" style=\"width: 100%;\">\n                <\u002Flabel>\n                <label class=\"field\" style=\"display: block;\">\n                  <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">E-mail<\u002Fspan>\n                  <input class=\"input\" type=\"email\" required=\"{{ true }}\" style=\"width: 100%;\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <label class=\"field\" style=\"display: block;\">\n                <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Objet<\u002Fspan>\n                <sc-raw-select class=\"input\" style=\"width: 100%;\">\n                  <option>Visiter un bien<\u002Foption>\n                  <option>Vendre un bien<\u002Foption>\n                  <option>Louer un bien<\u002Foption>\n                  <option>Gestion locative<\u002Foption>\n                  <option>Autre demande<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n              <label class=\"field\" style=\"display: block;\">\n                <span style=\"display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;\">Message<\u002Fspan>\n                <textarea class=\"input\" rows=\"6\" required=\"{{ true }}\" style=\"width: 100%;\"><\u002Ftextarea>\n              <\u002Flabel>\n              <button type=\"submit\" class=\"btn btn-primary btn-block\">Envoyer<\u002Fbutton>\n            <\u002Fform>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- FAVORIS -->\n  <sc-if value=\"{{ isFavoris }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(56px, 7vw, 104px) clamp(20px, 4vw, 40px) clamp(72px, 8vw, 120px);\">\n      <span style=\"display: block; font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 28px;\">Sélection<\u002Fspan>\n      <h1 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(42px, 5.4vw, 82px); line-height: 1.04; letter-spacing: 0; margin: 0 0 40px; margin-left: -0.022em;\">Vos favoris<\u002Fh1>\n      <sc-if value=\"{{ hasFavs }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: clamp(32px, 4vw, 64px) clamp(24px, 3vw, 48px); background: transparent;\">\n          <sc-for list=\"{{ favs }}\" as=\"b\" hint-placeholder-count=\"2\">\n            <article style=\"background: var(--color-bg);\">\n              <div class=\"grayscale\">\n                <image-slot id=\"{{ b.slotId }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Photo du bien\" style=\"width: 100%; aspect-ratio: 4 / 3;\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 26px; line-height: 1.18; margin: 20px 0 10px;\">{{ b.titre }}<\u002Fh3>\n              <p style=\"margin: 0 0 20px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 72%, transparent);\">{{ b.ville }} · {{ b.prixFmt }}<\u002Fp>\n              <div style=\"display: flex; gap: 8px;\">\n                <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ b.open }}\">Voir le bien<\u002Fbutton>\n                <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ b.toggleFav }}\">Retirer<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noFavs }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border: 2px solid var(--color-divider); padding: 48px 32px;\">\n          <p style=\"margin: 0 0 20px; font-size: 16px; color: color-mix(in srgb, var(--color-text) 80%, transparent);\">Aucun bien retenu pour l’instant. Ajoutez des biens depuis le portefeuille pour les comparer et les envoyer à l’agence.<\u002Fp>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goBiens }}\">Parcourir les biens<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n\n  <div style=\"position: fixed; right: 24px; bottom: 24px; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: 12px;\">\n    <sc-if value=\"{{ chatOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width: min(360px, calc(100vw - 48px)); background: var(--color-bg); border: 2px solid var(--color-accent-900); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; height: min(560px, calc(100vh - 130px));\">\n        <div style=\"background: var(--color-accent-900); color: var(--color-bg); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex: 0 0 auto;\">\n          <div>\n            <p style=\"font-family: var(--font-heading); font-size: 20px; margin: 0;\">Alassani en direct<\u002Fp>\n            <p style=\"margin: 4px 0 0; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; color: var(--color-accent-300);\">{{ chatStatus }}<\u002Fp>\n          <\u002Fdiv>\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ closeChat }}\" style=\"color: var(--color-bg); border-color: color-mix(in srgb, var(--color-bg) 55%, transparent); padding: 6px 12px;\">Fermer<\u002Fbutton>\n        <\u002Fdiv>\n        <div data-chat-list=\"1\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex: 1 1 0; min-height: 0;\">\n          <sc-for list=\"{{ chatMsgs }}\" as=\"m\" hint-placeholder-count=\"2\">\n            <div style=\"max-width: 86%; padding: 12px 16px; font-size: 14.5px; line-height: 1.55; align-self: {{ m.align }}; background: {{ m.bg }}; color: {{ m.fg }}; border: {{ m.border }};\">\n              <span style=\"display: block; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.62; margin-bottom: 6px;\">{{ m.who }}<\u002Fspan>\n              {{ m.text }}\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border-top: 2px solid var(--color-divider); padding: 12px 20px; display: flex; gap: 10px; overflow-x: auto; flex: 0 0 auto;\">\n          <sc-for list=\"{{ chatQuick }}\" as=\"qq\" hint-placeholder-count=\"3\">\n            <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ qq.send }}\" style=\"padding: 6px 12px; font-size: 10.5px; white-space: nowrap;\">{{ qq.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <form sc-camel-on-submit=\"{{ onChatSubmit }}\" style=\"border-top: 2px solid var(--color-divider); padding: 14px 20px; display: flex; gap: 10px; flex: 0 0 auto;\">\n          <input class=\"input\" type=\"text\" value=\"{{ chatDraft }}\" sc-camel-on-input=\"{{ onChatInput }}\" placeholder=\"Écrivez votre message…\" style=\"flex: 1 1 auto;\">\n          <button type=\"submit\" class=\"btn btn-primary\">Envoyer<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ toggleChat }}\" style=\"box-shadow: var(--shadow-md);\">{{ chatToggleLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <footer style=\"border-top: 2px solid var(--color-divider); background: var(--color-bg);\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(56px, 6vw, 88px) clamp(20px, 4vw, 40px); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px;\">\n      <div>\n        <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 20px; letter-spacing: 0; margin: 0 0 12px;\">{{ agencyName }}<\u002Fp>\n        <p style=\"margin: 0; font-size: 14px; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Rue des Cocotiers, Coconut — Lomé, Togo<br>{{ phone }}<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin: 0 0 12px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Acheter<\u002Fp>\n        <div style=\"display: grid; gap: 8px; font-size: 14px;\">\n          <a sc-camel-on-click=\"{{ goBiens }}\" style=\"cursor: pointer;\">Villas et maisons<\u002Fa>\n          <a sc-camel-on-click=\"{{ goBiens }}\" style=\"cursor: pointer;\">Appartements<\u002Fa>\n          <a sc-camel-on-click=\"{{ goBiens }}\" style=\"cursor: pointer;\">Biens de prestige<\u002Fa>\n          <a sc-camel-on-click=\"{{ goBiens }}\" style=\"cursor: pointer;\">Neuf, terrains &amp; investissement<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin: 0 0 12px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Vendre &amp; louer<\u002Fp>\n        <div style=\"display: grid; gap: 8px; font-size: 14px;\">\n          <a sc-camel-on-click=\"{{ goEstimation }}\" style=\"cursor: pointer;\">Estimation gratuite<\u002Fa>\n          <a sc-camel-on-click=\"{{ goContact }}\" style=\"cursor: pointer;\">Gestion locative<\u002Fa>\n          <a sc-camel-on-click=\"{{ goContact }}\" style=\"cursor: pointer;\">Commerces &amp; bureaux<\u002Fa>\n          <a sc-camel-on-click=\"{{ goContact }}\" style=\"cursor: pointer;\">Terrains<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin: 0 0 12px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Agence<\u002Fp>\n        <div style=\"display: grid; gap: 8px; font-size: 14px;\">\n          <a sc-camel-on-click=\"{{ goAgence }}\" style=\"cursor: pointer;\">L’équipe<\u002Fa>\n          <a sc-camel-on-click=\"{{ goContact }}\" style=\"cursor: pointer;\">Contact<\u002Fa>\n          <a sc-camel-on-click=\"{{ goHonoraires }}\" style=\"cursor: pointer;\">Honoraires<\u002Fa>\n          <a sc-camel-on-click=\"{{ goHonoraires }}\" style=\"cursor: pointer;\">Mentions légales<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px) 48px; font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 65%, transparent);\">\n      <p style=\"margin: 0;\">Agence immobilière enregistrée à Lomé — RCCM TG-LOM 2009 B 4187, NIF 1000 428 517. Honoraires de 5 % à la charge de l’acquéreur, barème affiché en agence. Prix en francs CFA. Biens présentés à titre d’exemple.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Noir &amp; blanc&quot;,&quot;Vert profond&quot;],&quot;default&quot;:&quot;Noir &amp; blanc&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Apparence&quot;},&quot;agencyName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Alassani Immobilier&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tagline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vente, location et gestion à Lomé depuis 2009.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Voir les biens disponibles&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+228 22 61 04 87&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showDocs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Affichage&quot;}}\">\nconst BIENS = [\n  { ref: \"VI-2411\", titre: \"Villa contemporaine R+1, piscine et dépendance\", ville: \"Baguida — route de Kpogan\", type: \"Villa\", statut: \"Vente\", prix: 185000000, surface: 320, pieces: 8, chambres: 5, config: \"R+1 sur 1 200 m² clos\", annee: \"2019\", badge: \"Titre foncier\",\n    description: \"Une villa livrée en 2019 sur un terrain titré de 1 200 m², entièrement muré avec portail motorisé. Séjour double de 68 m² ouvert sur la terrasse et la piscine, cuisine américaine équipée, cinq chambres dont deux suites climatisées. Groupe électrogène 15 kVA en relais automatique, forage avec surpresseur et bâche de 5 000 litres. Dépendance de deux pièces pour le personnel ou les invités.\",\n    prestations: [\"Piscine 9 × 4 traitée au sel\", \"Groupe électrogène automatique\", \"Forage et bâche 5 000 L\", \"Climatisation dans toutes les chambres\", \"Deux suites parentales\", \"Garage double et guérite\"],\n    docs: [{ label: \"Titre foncier\", ok: true }, { label: \"Plan de bornage\", ok: true }, { label: \"Permis de construire\", ok: true }, { label: \"Quitus fiscal\", ok: true }],\n    agent: \"Sofia Alassani\", agentRole: \"Directrice, biens de prestige\", featured: true },\n  { ref: \"AP-2388\", titre: \"Appartement traversant, vue sur la lagune\", ville
